services:
  go:
    build: ./backend
    container_name: backend-go
    env_file:
      - .env.development
    volumes:
      - /tmp:/sdc:ro
    expose:
      - 8080
    ports:
      - 8080:8080
    restart: always

  flaresolverr:
    image: 21hsmw/flaresolverr:nodriver
    container_name: flaresolverr
    expose:
      - 8191
    environment:
      - LOG_LEVEL=info
    restart: always
