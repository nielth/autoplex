# Works with plain `docker compose up -d --build` and as a Komodo stack.
# Images are built from this repo, nothing is pulled from a registry.
# The site is reached through an existing Caddy on the external `public-caddy`
# network: point it at http://autoplex-frontend:80.
services:
  mysql:
    image: mysql:8.4
    container_name: autoplex-mysql
    restart: always
    networks:
      - public-caddy
    environment:
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - 3306:3306
    volumes:
      # - /home/thomasnie/mysql:/var/lib/mysql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    container_name: autoplex-backend
    env_file:
      - .env.production
    volumes:
      # Same folders qBittorrent sees as /downloads/<disk>. Read-only: used for
      # free space and for ffprobe to read video bitrates.
      - /mnt/sdb/plex:/sdb:ro
      - /mnt/sdc/plex:/sdc:ro
      - /mnt/sdd/plex:/sdd:ro
      - /mnt/sde/plex:/sde:ro
    expose: 
      - 8080
    networks:
      - public-caddy
    restart: always
    depends_on:
      mysql:
        condition: service_healthy

  # Serves the app and proxies /api to the backend (see frontend/Caddyfile).
  frontend:
    build: ./frontend
    networks:
      - public-caddy
    depends_on:
      - backend
    env_file:
      - .env.production
    container_name: autoplex-frontend 
    restart: always
    expose:
      - 80

networks:
  public-caddy:
    external: true

volumes:
  mysql_data:
    name: mysql_data
    external: true
