---

services:
  mysql:
    image: mysql:8.4
    container_name: autoplex-mysql
    restart: always
    networks:
      - public-caddy
    environment:
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - 3306:3306
    volumes:
      - ${HOME}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  go:
    build: ./backend
    container_name: backend-go
    env_file:
      - .env.production
    volumes:
      - /mnt/sdc/:/sdc:ro
    expose: 
      - 8080
    networks:
      - public-caddy
    restart: always
    depends_on:
      mysql:
        condition: service_healthy

  node-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - public-caddy
    depends_on:
      - go
    env_file:
      - .env.production
    container_name: node-prod
    restart: always
    expose:
      - 80

networks:
  public-caddy:
    external: true
