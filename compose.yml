---

services:
  mysql:
    image: mysql:8.4
    container_name: autoplex-mysql
    restart: always
    environment:
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - 3306:3306
    volumes:
      - ${HOME}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  go:
    build: ./backend
    container_name: backend-go
    env_file:
      - .env.production
    volumes:
      - /mnt/sdc/:/sdc:ro
    expose: 
      - 8080
    restart: always
    depends_on:
      mysql:
        condition: service_healthy

  node-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - go
    env_file:
      - .env.production
    container_name: node-prod
    restart: always
    ports:
      - 8085:80
      - 8086:443
    volumes:
      - ./frontend/certbot/www:/var/www/certbot:ro
      - ./frontend/nginx/ssl:/etc/nginx/ssl:ro

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    restart: always
    volumes:
      - ./frontend/certbot/www:/var/www/certbot:rw
      - ./frontend/certbot/conf:/etc/letsencrypt:rw
    entrypoint: /bin/sh -c
    command: "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

